<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input {
            padding: 10px;
            width: 30%;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .delete-btn {
            background: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        #count {
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            input {
                width: 100%;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Employee Management System</h1>
    <p>FSD Project</p>
</header>

<div class="container">

    <div class="card">

        <h2>Add Employee</h2>

        <input type="text" id="name" placeholder="Employee Name">

        <input type="text" id="id" placeholder="Employee ID">

        <input type="text" id="department" placeholder="Department">

        <br>

        <button onclick="addEmployee()">Add Employee</button>

    </div>

    <div class="card">

        <h2>Search Employee</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by name or ID"
            onkeyup="searchEmployee()"
        >

        <p>Total Employees: <span id="count">0</span></p>

    </div>

    <div class="card">

        <h2>Employee Details</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Employee ID</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>

</div>

<script>

    let employees =
        JSON.parse(localStorage.getItem("employees")) || [];

    displayEmployees(employees);

    function addEmployee() {

        let name =
            document.getElementById("name").value.trim();

        let id =
            document.getElementById("id").value.trim();

        let department =
            document.getElementById("department").value.trim();

        if (name === "" || id === "" || department === "") {
            alert("Please fill all fields");
            return;
        }

        let employee = {
            name: name,
            id: id,
            department: department
        };

        employees.push(employee);

        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );

        document.getElementById("name").value = "";
        document.getElementById("id").value = "";
        document.getElementById("department").value = "";

        displayEmployees(employees);
    }

    function displayEmployees(list) {

        let table =
            document.getElementById("employeeTable");

        table.innerHTML = "";

        list.forEach(function(employee, index) {

            let row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${employee.name}</td>
                <td>${employee.id}</td>
                <td>${employee.department}</td>
                <td>
                    <button class="delete-btn"
                        onclick="deleteEmployee(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

        document.getElementById("count").innerText =
            list.length;
    }

    function deleteEmployee(index) {

        employees.splice(index, 1);

        localStorage.setItem(
            "employees",
            JSON.stringify(employees)
        );

        displayEmployees(employees);
    }

    function searchEmployee() {

        let text =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filtered =
            employees.filter(function(employee) {

                return (
                    employee.name
                        .toLowerCase()
                        .includes(text) ||

                    employee.id
                        .toLowerCase()
                        .includes(text)
                );
            });

        displayEmployees(filtered);
    }

</script>

</body>
</html>
